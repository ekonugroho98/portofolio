
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eko Nugroho — Backend Engineer & System Architect</title>
    <meta name="description" content="Backend Engineer & System Architect. 7+ years building high-performance systems in Go, Java, and scalable microservices." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Prevent flash of incorrect theme
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b981",
                        "primary-dark": "#059669",
                        "accent": "#22d3ee",
                        "background-light": "#f8fafc",
                        "background-dark": "#0a0f14",
                        "surface-light": "#ffffff",
                        "surface-dark": "#0f1620",
                        "neutral-surface": "#f1f5f9",
                    },
                    fontFamily: {
                        "sans": ["Inter", "system-ui", "sans-serif"],
                        "mono": ["JetBrains Mono", "ui-monospace", "monospace"]
                    }
                },
            },
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }

        /* Grid background pattern */
        .grid-bg {
            background-image:
                linear-gradient(to right, rgba(100,116,139,0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(100,116,139,0.07) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .dark .grid-bg {
            background-image:
                linear-gradient(to right, rgba(148,163,184,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148,163,184,0.06) 1px, transparent 1px);
        }

        /* Radial glow */
        .glow-primary {
            background: radial-gradient(closest-side, rgba(16,185,129,0.18), transparent);
        }

        .skill-card {
            transition: all 0.2s ease-in-out;
        }
        .skill-card:hover {
            box-shadow: 0 4px 16px rgba(16,185,129,0.10);
            transform: translateY(-2px);
            border-color: rgba(16,185,129,0.5);
        }
        .project-card-hover {
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .project-card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px -12px rgba(16,185,129,0.25);
            border-color: rgba(16,185,129,0.45);
        }

        /* Blinking terminal cursor */
        @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
        .cursor-blink { animation: blink 1.1s step-end infinite; }

        /* Fade-up entrance */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.6s ease-out both; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

        ::selection { background: rgba(16,185,129,0.25); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-300 font-sans antialiased">
    <div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
